name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Vite inlines these at build time. Accepts either the Variables or the
    # Secrets tab of Settings > Secrets and variables > Actions.
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify Supabase build vars
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Add it under Settings > Secrets and variables > Actions (repository scope, not an environment)."
              missing=1
            fi
          done
          exit $missing

      - run: npm ci

      - run: npm run build

      # GitHub Pages has no SPA rewrites: a first visit straight to /login,
      # /app or /reset-password (e.g. from an emailed link, before the service
      # worker is installed) would otherwise get Pages' own 404. Serving the
      # app shell as 404.html lets the client-side router take it from there.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
